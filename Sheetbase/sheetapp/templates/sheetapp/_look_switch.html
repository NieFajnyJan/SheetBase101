{# A small switch tucked in the bottom right corner: the normal look or the brutalist one, kept in this browser. #}
<form class="look-switch" method="post" action="{% url 'set_look' %}">{% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  {% if request.COOKIES.look == "brutalist" %}
    <button name="look" value="normal" role="switch" aria-checked="true" title="Back to the normal look">Brutalist</button>
  {% else %}
    <button name="look" value="brutalist" role="switch" aria-checked="false" title="Raw concrete, sharp edges, dark">Brutalist</button>
  {% endif %}
</form>
