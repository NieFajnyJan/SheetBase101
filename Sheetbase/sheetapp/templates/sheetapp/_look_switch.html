{# A small menu tucked in the bottom right corner: the looks open upwards from its button; the one picked is kept in this browser. #}
{% with look=request.COOKIES.look %}
<details class="look-switch">
  <summary title="Change how SheetBase looks">Look: {% if look == "brutalist" %}Brutalist{% elif look == "zus" %}ZUS{% else %}Normal{% endif %}</summary>
  <form method="post" action="{% url 'set_look' %}">{% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <ul aria-label="Looks">
      <li><button name="look" value="zus"{% if look == "zus" %} aria-current="true"{% endif %} title="Grey panels, green bars, small Tahoma: like the ZUS portal">ZUS</button></li>
      <li><button name="look" value="brutalist"{% if look == "brutalist" %} aria-current="true"{% endif %} title="Raw concrete, sharp edges, dark">Brutalist</button></li>
      <li><button name="look" value="normal"{% if look != "brutalist" and look != "zus" %} aria-current="true"{% endif %} title="Light, clean, rounded">Normal</button></li>
    </ul>
  </form>
</details>
{% endwith %}
