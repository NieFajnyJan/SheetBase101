name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Sheetbase  # where manage.py lives
    env:
      # Throwaway key for the test run only; the real one lives in Sheetbase/.env.
      # Google/Dex credentials are left unset, so those login buttons stay hidden.
      SECRET_KEY: ci-only-not-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r ../requirements.txt

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test
